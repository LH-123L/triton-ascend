name: Patch Docker Copyright Notice

on:
  workflow_dispatch:
    inputs:
      output_suffix:
        description: "新镜像 tag 的后缀；标准 tag 后追加 -<suffix>"
        required: true
        type: string
        default: copyright-fixed
      push_images:
        description: "是否推送新镜像到华为云 SWR"
        required: true
        type: boolean
        default: true
      overwrite_images:
        description: "允许覆盖已存在的新镜像 tag；默认禁止"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: patch-docker-copyright-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE_REPOSITORY: swr.cn-north-4.myhuaweicloud.com/opentile/triton
  TRITON_ASCEND_VERSION: "3.6.0"
  CANN_VERSION: "9.2.0"
  PYTORCH_VERSION: "2.10.0"
  TORCH_NPU_VERSION: "2.10.0.post7"
  PYTHON_SERIES: "3.11"
  PUSH_IMAGES: ${{ inputs.push_images }}
  OVERWRITE_IMAGES: ${{ inputs.overwrite_images }}
  OUTPUT_SUFFIX: ${{ inputs.output_suffix }}

jobs:
  build:
    name: Patch ${{ matrix.device_type }}-${{ matrix.os.name }}-${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        device_type:
          - "910b"
          - "950"
          - "a3"
        os:
          - name: debian12
          - name: ubuntu24.04
          - name: openeuler24.03
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate output suffix
        env:
          SUFFIX: ${{ inputs.output_suffix }}
        run: |
          set -euo pipefail
          if [[ ! "${SUFFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid output_suffix: ${SUFFIX}" >&2
            echo "Use only letters, digits, dots, underscores, and hyphens." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        if: ${{ inputs.push_images }}
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Generate image tags
        id: tags
        run: |
          set -euo pipefail
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          patched_tag="${base_tag}-${{ matrix.platform.arch }}-${OUTPUT_SUFFIX}"

          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_image=${IMAGE_REPOSITORY}:${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "patched_arch_image=${IMAGE_REPOSITORY}:${patched_tag}" >> "${GITHUB_OUTPUT}"

          echo "Source image:        ${IMAGE_REPOSITORY}:${base_tag}"
          echo "Patched arch image:  ${IMAGE_REPOSITORY}:${patched_tag}"

      - name: Check destination tag
        if: ${{ inputs.push_images && !inputs.overwrite_images }}
        env:
          DESTINATION_TAG: ${{ steps.tags.outputs.patched_arch_image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${DESTINATION_TAG}" >/dev/null 2>&1; then
            echo "Destination tag already exists: ${DESTINATION_TAG}" >&2
            echo "Use another output_suffix or explicitly enable overwrite_images." >&2
            exit 1
          fi

      - name: Build patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.copyright-patch
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          load: false
          outputs: ${{ inputs.push_images && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.patched_arch_image }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.source_image }}
          labels: |
            org.opencontainers.image.title=Triton-Ascend
            org.opencontainers.image.description=Triton-Ascend ${{ env.TRITON_ASCEND_VERSION }} with updated copyright notice
            org.opencontainers.image.version=${{ steps.tags.outputs.patched_arch_image }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  merge:
    name: Merge ${{ matrix.device_type }}-${{ matrix.os.name }}
    needs: build
    if: ${{ inputs.push_images }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        device_type:
          - "910b"
          - "950"
          - "a3"
        os:
          - name: debian12
          - name: ubuntu24.04
          - name: openeuler24.03

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Generate final image tag
        id: tags
        run: |
          set -euo pipefail
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"

      - name: Check final tag
        if: ${{ !inputs.overwrite_images }}
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
        run: |
          set -euo pipefail
          final_image="${IMAGE_REPOSITORY}:${BASE_TAG}-${OUTPUT_SUFFIX}"
          if docker buildx imagetools inspect "${final_image}" >/dev/null 2>&1; then
            echo "Destination tag already exists: ${final_image}" >&2
            echo "Use another output_suffix or explicitly enable overwrite_images." >&2
            exit 1
          fi

      - name: Create multi-architecture manifest
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
        run: |
          set -euo pipefail

          amd64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-amd64-${OUTPUT_SUFFIX}"
          arm64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-arm64-${OUTPUT_SUFFIX}"
          final_image="${IMAGE_REPOSITORY}:${BASE_TAG}-${OUTPUT_SUFFIX}"

          docker buildx imagetools inspect "${amd64_image}" >/dev/null
          docker buildx imagetools inspect "${arm64_image}" >/dev/null

          docker buildx imagetools create \
            --tag "${final_image}" \
            "${amd64_image}" \
            "${arm64_image}"

          echo "Published multi-architecture image:"
          docker buildx imagetools inspect "${final_image}"
