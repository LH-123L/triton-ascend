name: Patch Docker Copyright Notice

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "是否构建并覆盖推送 SWR 中的原镜像 tag"
        required: true
        type: boolean
        default: true
      confirm_overwrite:
        description: "我已确认：将覆盖 SWR 中的 9 个原始多架构 tag"
        required: true
        type: boolean
        default: false
      backup_existing:
        description: "覆盖前为原始多架构镜像创建带 run ID 的备份 tag"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: patch-docker-copyright-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE_REPOSITORY: swr.cn-north-4.myhuaweicloud.com/opentile/triton
  TRITON_ASCEND_VERSION: "3.6.0"
  CANN_VERSION: "9.2.0"
  PYTORCH_VERSION: "2.10.0"
  TORCH_NPU_VERSION: "2.10.0.post7"
  PYTHON_SERIES: "3.11"
  PUSH_IMAGES: ${{ inputs.push_images }}
  BACKUP_EXISTING: ${{ inputs.backup_existing }}

jobs:
  validate:
    name: Validate overwrite confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require explicit overwrite confirmation
        env:
          PUSH: ${{ inputs.push_images }}
          CONFIRMED: ${{ inputs.confirm_overwrite }}
        run: |
          set -euo pipefail
          if [[ "${PUSH}" == "true" && "${CONFIRMED}" != "true" ]]; then
            echo "Refusing to overwrite original SWR tags." >&2
            echo "Enable confirm_overwrite to continue." >&2
            exit 1
          fi

  build:
    name: Patch ${{ matrix.device_type }}-${{ matrix.os.name }}-${{ matrix.platform.arch }}
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        device_type:
          - "910b"
          - "950"
          - "a3"
        os:
          - name: debian12
          - name: ubuntu24.04
          - name: openeuler24.03
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        if: ${{ inputs.push_images }}
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Generate image tags
        id: tags
        run: |
          set -euo pipefail
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          stage_tag="${base_tag}-copyright-stage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform.arch }}"

          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_image=${IMAGE_REPOSITORY}:${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "staged_arch_image=${IMAGE_REPOSITORY}:${stage_tag}" >> "${GITHUB_OUTPUT}"

          echo "Source image:       ${IMAGE_REPOSITORY}:${base_tag}"
          echo "Staged arch image:  ${IMAGE_REPOSITORY}:${stage_tag}"

      - name: Build patched image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.copyright-patch
          platforms: linux/${{ matrix.platform.arch }}
          pull: true
          load: false
          outputs: ${{ inputs.push_images && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.staged_arch_image }}
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.source_image }}
          labels: |
            org.opencontainers.image.title=Triton-Ascend
            org.opencontainers.image.description=Triton-Ascend ${{ env.TRITON_ASCEND_VERSION }} with updated copyright notice
            org.opencontainers.image.version=${{ steps.tags.outputs.base_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  merge:
    name: Merge ${{ matrix.device_type }}-${{ matrix.os.name }}
    needs: build
    if: ${{ inputs.push_images }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        device_type:
          - "910b"
          - "950"
          - "a3"
        os:
          - name: debian12
          - name: ubuntu24.04
          - name: openeuler24.03

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Generate final image tag
        id: tags
        run: |
          set -euo pipefail
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          backup_tag="${base_tag}-copyright-backup-${{ github.run_id }}-${{ github.run_attempt }}"

          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "backup_tag=${backup_tag}" >> "${GITHUB_OUTPUT}"

      - name: Verify staged architecture images
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
        run: |
          set -euo pipefail

          amd64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-copyright-stage-${{ github.run_id }}-${{ github.run_attempt }}-amd64"
          arm64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-copyright-stage-${{ github.run_id }}-${{ github.run_attempt }}-arm64"

          docker buildx imagetools inspect "${amd64_image}" >/dev/null
          docker buildx imagetools inspect "${arm64_image}" >/dev/null

      - name: Verify original multi-architecture image
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
        run: |
          set -euo pipefail

          original_image="${IMAGE_REPOSITORY}:${BASE_TAG}"
          manifest="$(docker buildx imagetools inspect "${original_image}")"
          grep -q "linux/amd64" <<<"${manifest}"
          grep -q "linux/arm64" <<<"${manifest}"

      - name: Back up original multi-architecture image
        if: ${{ inputs.backup_existing }}
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
          BACKUP_TAG: ${{ steps.tags.outputs.backup_tag }}
        run: |
          set -euo pipefail

          original_image="${IMAGE_REPOSITORY}:${BASE_TAG}"
          backup_image="${IMAGE_REPOSITORY}:${BACKUP_TAG}"

          docker buildx imagetools create \
            --tag "${backup_image}" \
            "${original_image}"

          echo "Backed up ${original_image} to ${backup_image}"

      - name: Overwrite original multi-architecture tag
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
        run: |
          set -euo pipefail

          amd64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-copyright-stage-${{ github.run_id }}-${{ github.run_attempt }}-amd64"
          arm64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-copyright-stage-${{ github.run_id }}-${{ github.run_attempt }}-arm64"
          final_image="${IMAGE_REPOSITORY}:${BASE_TAG}"

          docker buildx imagetools create \
            --tag "${final_image}" \
            "${amd64_image}" \
            "${arm64_image}"

          manifest="$(docker buildx imagetools inspect "${final_image}")"
          grep -q "linux/amd64" <<<"${manifest}"
          grep -q "linux/arm64" <<<"${manifest}"

          echo "Overwrote original multi-architecture image:"
          printf '%s\n' "${manifest}"
